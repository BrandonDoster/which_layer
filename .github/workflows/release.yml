# Tag vX.Y.Z to publish a release: tests, builds, packages the exe as a zip
# and an Inno Setup installer, attests both, attaches them to the release.
# Manual runs do everything except the release (artifacts are uploaded instead).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # create the release
  id-token: write     # sign the attestation
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo test --release --locked
      - run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive target\release\which_layer.exe "dist\which_layer-$version-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Release
        if: github.ref_type == 'tag'
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: which_layer
          path: dist/*
